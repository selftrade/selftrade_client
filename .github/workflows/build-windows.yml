name: Build Windows Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.1) — leave empty to read from config.py'
        required: false

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r client_requirements.txt
          pip install nuitka ordered-set zstandard

      - name: Read version from config
        id: version
        shell: python
        run: |
          import os, re
          # Read version from client/config.py
          with open("client/config.py") as f:
              match = re.search(r'VERSION\s*=\s*["\']([^"\']+)["\']', f.read())
          version = "${{ github.event.inputs.version }}" or (match.group(1) if match else "1.0.0")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={version}\n")
          print(f"Building version: {version}")

      - name: Cache Nuitka compilation
        uses: actions/cache@v4
        with:
          path: ~/.cache/Nuitka
          key: nuitka-${{ runner.os }}-${{ hashFiles('client/**/*.py') }}
          restore-keys: nuitka-${{ runner.os }}-

      - name: Build with Nuitka
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m nuitka `
            --standalone `
            --onefile `
            --output-filename=SelfTrade-Setup.exe `
            --output-dir=dist `
            --windows-disable-console `
            --company-name=SelfTrade `
            --product-name="SelfTrade Client" `
            --product-version=$env:BUILD_VERSION `
            --file-description="SelfTrade Desktop Trading Client" `
            --copyright="SelfTrade 2024-2026" `
            --enable-plugin=pyqt6 `
            --enable-plugin=anti-bloat `
            --include-package=client `
            --include-package=client.ui `
            --include-package=client.services `
            --include-package=client.trading `
            --include-package=client.utils `
            --include-package=ccxt `
            --include-package=websockets `
            --include-package=aiohttp `
            --include-package=requests `
            --include-package=qasync `
            --include-package=ujson `
            --follow-imports `
            --nofollow-import-to=tkinter `
            --nofollow-import-to=unittest `
            --nofollow-import-to=test `
            --nofollow-import-to=setuptools `
            --nofollow-import-to=pip `
            --nofollow-import-to=distutils `
            --nofollow-import-to=ccxt.pro `
            client/main.py

      - name: Verify build
        run: |
          $exe = "dist/SelfTrade-Setup.exe"
          if (Test-Path $exe) {
            $size = (Get-Item $exe).Length / 1MB
            Write-Host "Build successful: $exe ($([math]::Round($size, 1)) MB)"
          } else {
            Write-Error "Build failed - .exe not found"
            exit 1
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SelfTrade-Setup
          path: dist/SelfTrade-Setup.exe
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: SelfTrade Client v${{ steps.version.outputs.version }}
          files: dist/SelfTrade-Setup.exe
          generate_release_notes: true
          body: |
            ## SelfTrade Client v${{ steps.version.outputs.version }}

            AI-powered cryptocurrency trading client.

            ### Installation
            1. Download `SelfTrade-Setup.exe` below
            2. Run it — Windows may show a SmartScreen warning on first run, click "More info" → "Run anyway"
            3. Login with your SelfTrade account and connect your exchange

            ### Supported Exchanges
            - Binance
            - MEXC
            - Bybit
